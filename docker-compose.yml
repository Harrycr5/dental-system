# Solo Redis + Celery. PostgreSQL es local (fuera de Docker) y FastAPI corre en el host.
name: dental

x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile.worker
  env_file: .env
  environment:
    # Dentro del contenedor "localhost" es el propio contenedor: se sobrescribe.
    DB_HOST: ${WORKER_DB_HOST:-host.docker.internal}
    REDIS_HOST: redis
  extra_hosts:
    - "host.docker.internal:host-gateway"   # necesario en Linux; inocuo en Docker Desktop
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *worker
    command: ["celery", "-A", "app.core.celery_app", "worker", "-Q", "default,notifications,reminders", "-l", "INFO", "--concurrency", "2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME -t 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    <<: *worker
    command: ["celery", "-A", "app.core.celery_app", "beat", "-l", "INFO", "--schedule", "/data/celerybeat-schedule"]
    volumes:
      - beat-data:/data
    healthcheck:
      # Comprobación básica (el archivo se crea al arrancar); en Fase 8 se sustituye por un latido en BD/Redis.
      test: ["CMD-SHELL", "ls /data/celerybeat-schedule* >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis-data:
  beat-data:
